name: Deploy Databricks Asset Bundle
on:
  pull_request_review:
    types: [submitted]

jobs:
  deploy:
    if: github.event.review.state == 'approved'
    runs-on: ubuntu-latest
    environment: ${{ github.event.pull_request.base.ref }}
    env:
      # DATABRICKS_HOST format: https://adb-<workspace-id>.<random-number>.azuredatabricks.net(no trailing slash)
      # These resolve from the GitHub Environment selected above (each environment
      # must define its own DATABRICKS_HOST / DATABRICKS_TOKEN secret values).
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Databricks CLI
        uses: databricks/setup-cli@main

      - name: Validate bundle
        working-directory: .
        run: databricks bundle validate -t ${{ github.event.pull_request.base.ref }}

      - name: Deploy bundle
        working-directory: .
        run: databricks bundle deploy -t ${{ github.event.pull_request.base.ref }}
