name: Deploy Databricks Asset Bundle
on:
  pull_request:
    branches:
      - dev
      - main
  workflow_dispatch:
    inputs:
      target:
        description: "Bundle target to deploy"
        required: true
        default: "dev"
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.target || github.base_ref }}
    env:
      # DATABRICKS_HOST format: https://adb-<workspace-id>.<random-number>.azuredatabricks.net(no trailing slash)
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Databricks CLI
        uses: databricks/setup-cli@main

      - name: Validate bundle
        working-directory: .
        run: databricks bundle validate -t ${{ github.event.inputs.target || github.base_ref }}
        
      - name: Deploy bundle
        working-directory: .
        run: databricks bundle deploy -t ${{ github.event.inputs.target || github.base_ref }}