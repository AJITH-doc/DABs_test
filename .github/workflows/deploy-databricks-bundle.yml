name: Deploy Databricks Asset Bundle

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      target:
        description: "Bundle target to deploy (e.g. dev, staging, prod)"
        required: true
        default: "dev"

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.target || 'dev' }}

    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Databricks CLI
        uses: databricks/setup-cli@main

      - name: Validate bundle
        working-directory: ./databricks_dab_template
        run: databricks bundle validate -t ${{ github.event.inputs.target || 'dev' }}

      - name: Deploy bundle
        working-directory: ./databricks_dab_template
        run: databricks bundle deploy -t ${{ github.event.inputs.target || 'dev' }}