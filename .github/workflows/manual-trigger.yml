name: Manual Trigger Databricks Asset Bundle

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to deploy (also used as the target environment)
        required: true
        type: choice
        options:
          - dev
          - prod

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.branch }}
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
      DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
      DATABRICKS_AUTH_TYPE: oauth-m2m
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}

      - name: Install Databricks CLI
        uses: databricks/setup-cli@main

      - name: Validate bundle
        working-directory: .
        run: databricks bundle validate -t ${{ inputs.branch }}

      - name: Deploy bundle
        working-directory: .
        run: databricks bundle deploy -t ${{ inputs.branch }}
