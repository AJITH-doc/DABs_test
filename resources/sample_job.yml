resources:
  jobs:
    sample_job:
      name: sample_job

      job_clusters:
        - job_cluster_key: default_cluster
          new_cluster:
            spark_version: 17.3.x-scala2.13
            node_type_id: Standard_D2ads_v6
            num_workers: 0
            data_security_mode: USER_ISOLATION
            custom_tags:
              ResourceClass: SingleNode
            spark_conf:
              spark.databricks.cluster.profile: singleNode
              spark.master: local[*, 4]

      tasks:
        - task_key: dlt_pipeline
          pipeline_task:
            pipeline_id: ${resources.pipelines.sales_pipeline.id}

        - task_key: agg_task
          depends_on:
            - task_key: dlt_pipeline
          job_cluster_key: default_cluster
          notebook_task:
            notebook_path: ../src/agg_task.py

      schedule:
        quartz_cron_expression: "0 0 * * * ?"   # every 1 hour, at minute 0
        timezone_id: "UTC"
        pause_status: PAUSED 