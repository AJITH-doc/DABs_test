resources:
  jobs:
    sample_job:
      name: sample_job

      tasks:
        - task_key: dlt_pipeline
          pipeline_task:
            pipeline_id: ${resources.pipelines.sales_pipeline.id}

        - task_key: agg_task
          depends_on:
            - task_key: dlt_pipeline
          existing_cluster_id: ${var.cluster_id}
          notebook_task:
            notebook_path: ../src/agg_task.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}

      schedule:
        quartz_cron_expression: "0 0 * * * ?"   # every 1 hour, at minute 0
        timezone_id: "UTC"
        pause_status: PAUSED 